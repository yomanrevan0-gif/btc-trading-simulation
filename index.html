 <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Trading Simulator</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: white;
    }

    .container {
      max-width: 720px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 8px 0 5px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 18px;
    }

    .price-box {
      background: #172033;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      margin-bottom: 15px;
    }

    .price-label {
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .price {
      font-size: 34px;
      font-weight: bold;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }

    .online {
      color: #22c55e;
    }

    .offline {
      color: #ef4444;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .card {
      background: #172033;
      padding: 17px;
      border-radius: 14px;
    }

    .card-title {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 19px;
      font-weight: bold;
      word-break: break-word;
    }

    .trading-box,
    .chart-box,
    .history {
      background: #172033;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      color: #cbd5e1;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #60a5fa;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      padding: 14px;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy {
      background: #16a34a;
    }

    .sell {
      background: #dc2626;
    }

    button:active {
      transform: scale(0.98);
    }

    .message {
      min-height: 22px;
      margin-top: 14px;
      color: #facc15;
      font-weight: bold;
      text-align: center;
    }

    .transaction {
      padding: 12px 0;
      border-bottom: 1px solid #334155;
      line-height: 1.6;
    }

    .transaction:last-child {
      border-bottom: none;
    }

    .buy-text {
      color: #22c55e;
      font-weight: bold;
    }

    .sell-text {
      color: #ef4444;
      font-weight: bold;
    }

    .profit {
      color: #22c55e;
    }

    .loss {
      color: #ef4444;
    }

    .empty {
      color: #94a3b8;
      text-align: center;
      padding: 15px;
    }

    canvas {
      max-height: 300px;
    }

    @media (max-width: 500px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 24px;
      }

      .price {
        font-size: 28px;
      }

      .card-value {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>₿ BTC Trading Simulator</h1>

  <div class="subtitle">
    Simulasi Trading BTC/USDT
  </div>

  <!-- HARGA -->
  <div class="price-box">

    <div class="price-label">
      Harga BTC
    </div>

    <div class="price" id="price">
      Mengambil harga...
    </div>

    <div class="status" id="status">
      Menghubungkan ke server harga...
    </div>

  </div>


  <!-- PORTOFOLIO -->
  <div class="cards">

    <div class="card">
      <div class="card-title">
        Saldo USDT
      </div>

      <div class="card-value" id="balance">
        $1,000.00
      </div>
    </div>


    <div class="card">
      <div class="card-title">
        BTC Dimiliki
      </div>

      <div class="card-value" id="btc">
        0 BTC
      </div>
    </div>


    <div class="card">
      <div class="card-title">
        Nilai Portofolio
      </div>

      <div class="card-value" id="portfolio">
        $1,000.00
      </div>
    </div>


    <div class="card">
      <div class="card-title">
        Profit / Loss
      </div>

      <div class="card-value" id="profit">
        $0.00
      </div>
    </div>

  </div>


  <!-- TRADING -->
  <div class="trading-box">

    <h2>Trading</h2>

    <label>
      Jumlah USDT untuk BUY
    </label>

    <input
      id="buyAmount"
      type="number"
      min="1"
      step="0.01"
      value="100"
      placeholder="Contoh: 100"
    >

    <button
      class="buy"
      style="width:100%; margin-top:10px;"
      onclick="buyBTC()"
    >
      BUY BTC
    </button>


    <label>
      Jumlah BTC untuk SELL
    </label>

    <input
      id="sellAmount"
      type="number"
      min="0"
      step="0.00000001"
      placeholder="Contoh: 0.001"
    >

    <button
      class="sell"
      style="width:100%; margin-top:10px;"
      onclick="sellBTC()"
    >
      SELL BTC
    </button>


    <div
      class="message"
      id="message"
    ></div>

  </div>


  <!-- GRAFIK -->
  <div class="chart-box">

    <h2>Grafik Harga BTC</h2>

    <canvas id="chart"></canvas>

  </div>


  <!-- RIWAYAT -->
  <div class="history">

    <h2>Riwayat Transaksi</h2>

    <div id="history">

      <div class="empty">
        Belum ada transaksi.
      </div>

    </div>

  </div>

</div>


<script>

  // ==================================================
  // DATA SIMULASI
  // ==================================================

  let balance = 1000;

  let btcHold = 0;

  const initialBalance = 1000;

  let currentPrice = 0;

  let transactions = [];


  // ==================================================
  // FORMAT UANG
  // ==================================================

  function money(value) {

    return "$" + Number(value).toLocaleString("en-US", {

      minimumFractionDigits: 2,

      maximumFractionDigits: 2

    });

  }


  // ==================================================
  // FORMAT BTC
  // ==================================================

  function btcFormat(value) {

    return Number(value).toFixed(8) + " BTC";

  }


  // ==================================================
  // CHART
  // ==================================================

  const ctx =
    document
      .getElementById("chart")
      .getContext("2d");


  const chart = new Chart(ctx, {

    type: "line",

    data: {

      labels: [],

      datasets: [{

        label: "BTC / USD",

        data: [],

        borderColor: "#3b82f6",

        backgroundColor: "rgba(59,130,246,0.10)",

        borderWidth: 2,

        fill: true,

        tension: 0.3,

        pointRadius: 0

      }]

    },

    options: {

      responsive: true,

      animation: false,

      scales: {

        x: {

          ticks: {

            color: "#94a3b8",

            maxTicksLimit: 6

          }

        },

        y: {

          ticks: {

            color: "#94a3b8",

            callback: function(value) {

              return "$" +
                Number(value).toLocaleString();

            }

          }

        }

      },

      plugins: {

        legend: {

          labels: {

            color: "white"

          }

        }

      }

    }

  });


  // ==================================================
  // UPDATE HARGA DI HALAMAN
  // ==================================================

  function setPrice(price, source) {

    if (!price || !isFinite(price)) {

      throw new Error("Harga tidak valid");

    }

    currentPrice = Number(price);


    document
      .getElementById("price")
      .innerText = money(currentPrice);


    const status =
      document.getElementById("status");


    status.innerText =
      "● Online • Sumber: " + source;


    status.className =
      "status online";


    // Grafik

    chart.data.labels.push(
      new Date().toLocaleTimeString()
    );

    chart.data.datasets[0].data.push(
      currentPrice
    );


    // Simpan maksimal 40 titik

    if (chart.data.labels.length > 40) {

      chart.data.labels.shift();

      chart.data.datasets[0].data.shift();

    }


    chart.update();

    updateAccount();

  }


  // ==================================================
  // SUMBER 1-5: BINANCE
  // ==================================================

  const binanceEndpoints = [

    "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT",

    "https://api1.binance.com/api/v3/ticker/price?symbol=BTCUSDT",

    "https://api2.binance.com/api/v3/ticker/price?symbol=BTCUSDT",

    "https://api3.binance.com/api/v3/ticker/price?symbol=BTCUSDT",

    "https://api4.binance.com/api/v3/ticker/price?symbol=BTCUSDT"

  ];


  async function getBinancePrice() {

    for (const url of binanceEndpoints) {

      try {

        const controller =
          new AbortController();


        const timeout =
          setTimeout(
            () => controller.abort(),
            5000
          );


        const response =
          await fetch(url, {

            method: "GET",

            cache: "no-store",

            signal: controller.signal

          });


        clearTimeout(timeout);


        if (!response.ok) {

          continue;

        }


        const data =
          await response.json();


        const price =
          Number(data.price);


        if (price > 0) {

          setPrice(price, "Binance");

          return true;

        }

      }

      catch (error) {

        // Coba endpoint Binance berikutnya

      }

    }

    return false;

  }


  // ==================================================
  // FALLBACK: COINGECKO
  // ==================================================

  async function getCoinGeckoPrice() {

    try {

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () => controller.abort(),
          7000
        );


      const response =
        await fetch(

          "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd",

          {

            method: "GET",

            cache: "no-store",

            signal: controller.signal

          }

        );


      clearTimeout(timeout);


      if (!response.ok) {

        throw new Error(
          "CoinGecko HTTP " + response.status
        );

      }


      const data =
        await response.json();


      const price =
        Number(data.bitcoin.usd);


      if (price <= 0) {

        throw new Error(
          "Harga tidak valid"
        );

      }


      setPrice(
        price,
        "CoinGecko"
      );


      return true;

    }

    catch (error) {

      return false;

    }

  }


  // ==================================================
  // AMBIL HARGA
  // ==================================================

  async function getPrice() {

    document
      .getElementById("status")
      .innerText =
      "● Mengambil harga...";


    // Coba Binance

    const binanceOK =
      await getBinancePrice();


    if (binanceOK) {

      return;

    }


    // Jika Binance gagal,
    // gunakan CoinGecko

    const coinGeckoOK =
      await getCoinGeckoPrice();


    if (coinGeckoOK) {

      return;

    }


    // Semua gagal

    document
      .getElementById("price")
      .innerText =
      "Tidak tersedia";


    const status =
      document.getElementById("status");


    status.innerText =
      "● Gagal mengambil harga";


    status.className =
      "status offline";

  }


  // ==================================================
  // BUY
  // ==================================================

  function buyBTC() {

    if (currentPrice <= 0) {

      showMessage(
        "Harga BTC belum tersedia."
      );

      return;

    }


    const amount =
      Number(
        document
          .getElementById("buyAmount")
          .value
      );


    if (!amount || amount <= 0) {

      showMessage(
        "Masukkan jumlah USDT."
      );

      return;

    }


    if (amount > balance) {

      showMessage(
        "Saldo USDT tidak cukup."
      );

      return;

    }


    const btcBought =
      amount / currentPrice;


    balance -= amount;

    btcHold += btcBought;


    transactions.unshift({

      type: "BUY",

      btc: btcBought,

      usdt: amount,

      price: currentPrice,

      time:
        new Date()
          .toLocaleString()

    });


    showMessage(

      "BUY berhasil: " +
      btcBought.toFixed(8) +
      " BTC"

    );


    updateAccount();

    updateHistory();

  }


  // ==================================================
  // SELL
  // ==================================================

  function sellBTC() {

    if (currentPrice <= 0) {

      showMessage(
        "Harga BTC belum tersedia."
      );

      return;

    }


    const amount =
      Number(
        document
          .getElementById("sellAmount")
          .value
      );


    if (!amount || amount <= 0) {

      showMessage(
        "Masukkan jumlah BTC."
      );

      return;

    }


    if (amount > btcHold) {

      showMessage(
        "BTC yang dimiliki tidak cukup."
      );

      return;

    }


    const received =
      amount * currentPrice;


    btcHold -= amount;

    balance += received;


    transactions.unshift({

      type: "SELL",

      btc: amount,

      usdt: received,

      price: currentPrice,

      time:
        new Date()
          .toLocaleString()

    });


    showMessage(

      "SELL berhasil: " +
      money(received)

    );


    updateAccount();

    updateHistory();

  }


  // ==================================================
  // UPDATE PORTOFOLIO
  // ==================================================

  function updateAccount() {

    const btcValue =
      btcHold * currentPrice;


    const portfolio =
      balance + btcValue;


    const profit =
      portfolio - initialBalance;


    document
      .getElementById("balance")
      .innerText =
      money(balance);


    document
      .getElementById("btc")
      .innerText =
      btcFormat(btcHold);


    document
      .getElementById("portfolio")
      .innerText =
      money(portfolio);


    const profitElement =
      document
        .getElementById("profit");


    profitElement.innerText =

      (profit >= 0 ? "+" : "") +
      money(profit);


    profitElement.className =

      "card-value " +
      (profit >= 0
        ? "profit"
        : "loss");

  }


  // ==================================================
  // RIWAYAT
  // ==================================================

  function updateHistory() {

    const element =
      document
        .getElementById("history");


    if (transactions.length === 0) {

      element.innerHTML =

        '<div class="empty">' +
        'Belum ada transaksi.' +
        '</div>';

      return;

    }


    element.innerHTML =

      transactions
        .map(function(tx) {

          const className =
            tx.type === "BUY"
              ? "buy-text"
              : "sell-text";


          return `

            <div class="transaction">

              <div class="${className}">
                ${tx.type}
              </div>

              BTC:
              ${tx.btc.toFixed(8)}

              <br>

              Nilai:
              ${money(tx.usdt)}

              <br>

              Harga:
              ${money(tx.price)}

              <br>

              <small>
                ${tx.time}
              </small>

            </div>

          `;

        })
        .join("");

  }


  // ==================================================
  // PESAN
  // ==================================================

  function showMessage(text) {

    const element =
      document
        .getElementById("message");


    element.innerText = text;


    setTimeout(function() {

      element.innerText = "";

    }, 4000);

  }


  // ==================================================
  // MULAI
  // ==================================================

  getPrice();


  // Update setiap 15 detik.
  // Tidak terlalu sering agar API tidak cepat
  // terkena rate limit.

  setInterval(
    getPrice,
    15000
  );


  updateAccount();

</script>

</body>
</html>
