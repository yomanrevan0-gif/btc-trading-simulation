<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Trading Simulator</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .price-box {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 15px;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
    }

    .update {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 15px;
    }

    .card {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
    }

    .card-title {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .card-value {
      font-size: 20px;
      font-weight: bold;
    }

    .trading-box {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #334155;
      color: white;
      font-size: 16px;
      margin: 8px 0 12px;
    }

    button {
      border: none;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 8px;
    }

    .buy {
      background: #22c55e;
      color: white;
    }

    .sell {
      background: #ef4444;
      color: white;
    }

    .chart-box {
      background: #1e293b;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .history {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
    }

    .transaction {
      border-bottom: 1px solid #334155;
      padding: 10px 0;
      font-size: 14px;
    }

    .profit {
      color: #22c55e;
    }

    .loss {
      color: #ef4444;
    }

    .message {
      margin-top: 12px;
      color: #facc15;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
      }

      .price {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>₿ BTC Trading Simulator</h1>
  <div class="subtitle">Simulasi Trading BTC/USDT</div>

  <div class="price-box">
    <div>Harga BTC/USDT</div>
    <div class="price" id="price">Mengambil harga...</div>
    <div class="update" id="update">Menunggu data...</div>
  </div>

  <div class="cards">

    <div class="card">
      <div class="card-title">Saldo USDT</div>
      <div class="card-value" id="balance">$1,000.00</div>
    </div>

    <div class="card">
      <div class="card-title">BTC Dimiliki</div>
      <div class="card-value" id="btc">0 BTC</div>
    </div>

    <div class="card">
      <div class="card-title">Nilai Portofolio</div>
      <div class="card-value" id="portfolio">$1,000.00</div>
    </div>

    <div class="card">
      <div class="card-title">Profit / Loss</div>
      <div class="card-value" id="profit">$0.00</div>
    </div>

  </div>

  <div class="trading-box">

    <h2>Trading</h2>

    <label>Jumlah USDT untuk Buy</label>

    <input
      type="number"
      id="buyAmount"
      placeholder="Contoh: 100"
      value="100"
      min="1"
    >

    <button class="buy" onclick="buyBTC()">
      BUY BTC
    </button>

    <hr style="border-color:#334155; margin:20px 0;">

    <label>Jumlah BTC untuk Sell</label>

    <input
      type="number"
      id="sellAmount"
      placeholder="Contoh: 0.001"
      step="0.00000001"
      min="0"
    >

    <button class="sell" onclick="sellBTC()">
      SELL BTC
    </button>

    <div class="message" id="message"></div>

  </div>

  <div class="chart-box">

    <h2>Grafik BTC</h2>

    <canvas id="chart"></canvas>

  </div>

  <div class="history">

    <h2>Riwayat Transaksi</h2>

    <div id="history">
      Belum ada transaksi.
    </div>

  </div>

</div>


<script>

  // ==============================
  // DATA SIMULASI
  // ==============================

  let balance = 1000;
  let btcHold = 0;

  let initialBalance = 1000;
  let currentPrice = 0;

  let transactions = [];

  // ==============================
  // FORMAT UANG
  // ==============================

  function money(value) {

    return "$" + Number(value).toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  }


  // ==============================
  // FORMAT BTC
  // ==============================

  function btcFormat(value) {

    return Number(value).toFixed(8) + " BTC";

  }


  // ==============================
  // CHART
  // ==============================

  const ctx =
    document.getElementById("chart").getContext("2d");

  const chart = new Chart(ctx, {

    type: "line",

    data: {

      labels: [],

      datasets: [{

        label: "BTC/USDT",

        data: [],

        borderColor: "#3b82f6",

        backgroundColor: "rgba(59,130,246,0.1)",

        borderWidth: 2,

        fill: true,

        tension: 0.3,

        pointRadius: 0

      }]

    },

    options: {

      responsive: true,

      animation: false,

      scales: {

        x: {
          ticks: {
            color: "#94a3b8"
          }
        },

        y: {
          ticks: {
            color: "#94a3b8"
          }
        }

      },

      plugins: {

        legend: {
          labels: {
            color: "white"
          }
        }

      }

    }

  });


  // ==============================
  // AMBIL HARGA BTC
  // ==============================

  async function getPrice() {

    try {

      const response = await fetch(
        "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT"
      );

      if (!response.ok) {
        throw new Error("Gagal mengambil harga");
      }

      const data = await response.json();

      currentPrice = parseFloat(data.price);

      document.getElementById("price").innerText =
        money(currentPrice);

      document.getElementById("update").innerText =
        "Harga diperbarui: " +
        new Date().toLocaleTimeString();

      // Update chart

      chart.data.labels.push(
        new Date().toLocaleTimeString()
      );

      chart.data.datasets[0].data.push(currentPrice);

      // Maksimal 30 data

      if (chart.data.labels.length > 30) {

        chart.data.labels.shift();

        chart.data.datasets[0].data.shift();

      }

      chart.update();

      updateAccount();

    }

    catch (error) {

      document.getElementById("price").innerText =
        "Gagal mengambil harga";

      document.getElementById("update").innerText =
        "Periksa koneksi internet.";

    }

  }


  // ==============================
  // BUY BTC
  // ==============================

  function buyBTC() {

    if (currentPrice <= 0) {

      showMessage("Harga BTC belum tersedia.");

      return;

    }

    const amount =
      parseFloat(
        document.getElementById("buyAmount").value
      );

    if (!amount || amount <= 0) {

      showMessage("Masukkan jumlah USDT yang benar.");

      return;

    }

    if (amount > balance) {

      showMessage("Saldo USDT tidak cukup.");

      return;

    }

    const btcBought =
      amount / currentPrice;

    balance -= amount;

    btcHold += btcBought;

    transactions.unshift({

      type: "BUY",

      btc: btcBought,

      usdt: amount,

      price: currentPrice,

      time: new Date().toLocaleTimeString()

    });

    showMessage(
      "Berhasil membeli " +
      btcBought.toFixed(8) +
      " BTC"
    );

    updateAccount();

    updateHistory();

  }


  // ==============================
  // SELL BTC
  // ==============================

  function sellBTC() {

    if (currentPrice <= 0) {

      showMessage("Harga BTC belum tersedia.");

      return;

    }

    const amount =
      parseFloat(
        document.getElementById("sellAmount").value
      );

    if (!amount || amount <= 0) {

      showMessage("Masukkan jumlah BTC yang benar.");

      return;

    }

    if (amount > btcHold) {

      showMessage("BTC yang kamu miliki tidak cukup.");

      return;

    }

    const usdtReceived =
      amount * currentPrice;

    btcHold -= amount;

    balance += usdtReceived;

    transactions.unshift({

      type: "SELL",

      btc: amount,

      usdt: usdtReceived,

      price: currentPrice,

      time: new Date().toLocaleTimeString()

    });

    showMessage(
      "Berhasil menjual " +
      amount.toFixed(8) +
      " BTC"
    );

    updateAccount();

    updateHistory();

  }


  // ==============================
  // UPDATE ACCOUNT
  // ==============================

  function updateAccount() {

    const btcValue =
      btcHold * currentPrice;

    const portfolio =
      balance + btcValue;

    const profit =
      portfolio - initialBalance;

    document.getElementById("balance").innerText =
      money(balance);

    document.getElementById("btc").innerText =
      btcFormat(btcHold);

    document.getElementById("portfolio").innerText =
      money(portfolio);

    const profitElement =
      document.getElementById("profit");

    profitElement.innerText =
      (profit >= 0 ? "+" : "") +
      money(profit);

    profitElement.className =
      "card-value " +
      (profit >= 0 ? "profit" : "loss");

  }


  // ==============================
  // RIWAYAT TRANSAKSI
  // ==============================

  function updateHistory() {

    const historyElement =
      document.getElementById("history");

    if (transactions.length === 0) {

      historyElement.innerHTML =
        "Belum ada transaksi.";

      return;

    }

    historyElement.innerHTML =
      transactions.map(function(tx) {

        return `

          <div class="transaction">

            <strong>${tx.type}</strong>

            <br>

            ${tx.btc.toFixed(8)} BTC

            <br>

            Nilai:
            ${money(tx.usdt)}

            <br>

            Harga:
            ${money(tx.price)}

            <br>

            <small>${tx.time}</small>

          </div>

        `;

      }).join("");

  }


  // ==============================
  // PESAN
  // ==============================

  function showMessage(text) {

    const message =
      document.getElementById("message");

    message.innerText = text;

    setTimeout(function() {

      message.innerText = "";

    }, 4000);

  }


  // ==============================
  // MULAI
  // ==============================

  getPrice();

  setInterval(getPrice, 5000);

  updateAccount();

</script>

</body>
</html>
